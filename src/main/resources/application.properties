# =====================================================
# APPLICATION
# =====================================================

spring.application.name=backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =====================================================
# SERVER
# =====================================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =====================================================
# DATABASE
# =====================================================

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =====================================================
# JPA
# =====================================================

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=false

# =====================================================
# HIKARI
# =====================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}

jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =====================================================
# ACCOUNT SECURITY
# =====================================================

app.security.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
app.security.account-lock-duration-minutes=${ACCOUNT_LOCK_DURATION_MINUTES:30}

# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# =====================================================
# STORAGE
# =====================================================

file.upload-dir=${FILE_UPLOAD_DIR:storage/documents}

app.upload.profile-images-dir=${PROFILE_IMAGES_DIR:uploads/profile-images}
app.upload.profile-images-url=${PROFILE_IMAGES_URL:/uploads/profile-images}

# =====================================================
# ENCRYPTION
# =====================================================

encryption.enabled=${ENCRYPTION_ENABLED:true}
encryption.algorithm=AES/GCM/NoPadding

encryption.key=${ENCRYPTION_KEY}

encryption.key-version=${ENCRYPTION_KEY_VERSION:v1}
encryption.iv-length=12
encryption.authentication-tag-length=128
encryption.buffer-size=8192

# =====================================================
# CORS
# =====================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

app.cors.allowed-headers=*

app.cors.exposed-headers=Authorization

app.cors.allow-credentials=true

app.cors.max-age=3600

# =====================================================
# EMAIL
# =====================================================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM}
app.mail.from-name=LastKey

# =====================================================
# SWAGGER
# =====================================================

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

# =====================================================
# INFO
# =====================================================

info.app.name=LastKey Backend
info.app.description=AI Powered Digital Legacy Management Platform
info.app.version=1.0.0
info.app.author=Trayambak Pandey

# =====================================================
# LOGGING
# =====================================================

logging.config=classpath:logback-spring.xml

logging.file.path=${LOG_PATH:logs}

logging.level.root=INFO
logging.level.com.lastkey.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN